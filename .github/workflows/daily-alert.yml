name: Daily Job Alert

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      debug_ats:
        description: "Sonder l'ATS IEA/GCF (1 = oui)"
        required: false
        default: ""

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GREENHOUSE_BOARDS: ${{ secrets.GREENHOUSE_BOARDS }}
          LEVER_COMPANIES: ${{ secrets.LEVER_COMPANIES }}
          SMARTRECRUITERS_COMPANIES: ${{ secrets.SMARTRECRUITERS_COMPANIES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          DEBUG_ATS: ${{ github.event.inputs.debug_ats }}
        run: python scraper.py

      - name: Sauvegarder fichiers
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_jobs.json today_jobs.json rejected_keywords.json rejected_reasons.json ai_verdicts.json source_health.json || true
          git status
          git diff --staged --quiet || git commit -m "Update jobs data"
          git push origin HEAD
