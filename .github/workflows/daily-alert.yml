name: Daily Job Alert

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}

          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}

          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}

          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

          GREENHOUSE_BOARDS: ""

          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scraper.py

      - name: Sauvegarder fichiers
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_jobs.json today_jobs.json || true
          git add rejected_keywords.json || true
          git status
          git diff --staged --quiet || git commit -m "Update jobs data"
          git push origin main
